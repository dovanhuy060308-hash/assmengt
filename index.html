<style>
:root{--navy:#101d3a;--blue:#2458d3;--sky:#eaf1ff;--orange:#f47721;--ink:#17233d;--muted:#71809b;--line:#e7ebf2;--bg:#f5f7fb;--white:#fff;--shadow:0 12px 35px rgba(21,42,84,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 28px}.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ff8b38,#f15a24);display:grid;place-items:center;font-weight:900;font-size:17px}.brand strong{display:block;font-size:15px;letter-spacing:.4px}.brand small{color:#aab8d4;font-size:11px}.nav-label{color:#7f91b4;text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800;padding:12px 12px 8px}.nav button{width:100%;border:0;background:transparent;color:#c4cde0;text-align:left;padding:11px 12px;border-radius:11px;margin:2px 0;display:flex;align-items:center;gap:11px;font-size:13px}.nav button:hover,.nav button.active{background:#23365d;color:#fff}.nav .ico{width:23px;text-align:center;font-size:16px}.side-bottom{margin-top:28px;padding:15px;border:1px solid #344568;border-radius:14px;background:#172849}.side-bottom b{font-size:12px}.side-bottom p{font-size:11px;color:#aab8d4;margin:5px 0 0}
.main{min-width:0}.topbar{height:72px;background:#ffffffdd;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}.top-actions{display:flex;align-items:center;gap:12px}.search{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;width:220px;outline:none}.avatar{width:34px;height:34px;border-radius:50%;background:#fff0e6;color:#dc641b;display:grid;place-items:center;font-weight:800}
.content{max-width:1240px;margin:auto;padding:32px 36px 60px}.eyebrow{font-size:11px;letter-spacing:1.7px;color:var(--blue);font-weight:800;text-transform:uppercase}.hero{border-radius:22px;background:linear-gradient(115deg,#13264c 0%,#1d438b 65%,#2867d9 100%);color:#fff;padding:36px 40px;display:grid;grid-template-columns:1.35fr .65fr;gap:20px;overflow:hidden;position:relative;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:330px;height:330px;border:1px solid #ffffff25;border-radius:50%;right:-60px;top:-150px;box-shadow:0 0 0 40px #ffffff09,0 0 0 80px #ffffff08}.hero h1{font-size:clamp(27px,3vw,40px);line-height:1.15;margin:10px 0 13px;max-width:680px}.hero p{color:#d5e0f8;max-width:650px;margin:0 0 23px}.hero .eyebrow{color:#ffb47e}.primary{border:0;border-radius:10px;background:var(--orange);color:#fff;padding:11px 17px;font-weight:750;box-shadow:0 6px 15px #e96c2b44}.hero-visual{display:flex;align-items:center;justify-content:center;position:relative;z-index:1}.orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8bc3ff,#3269d4 48%,#142957 72%);box-shadow:0 0 0 18px #ffffff0c,0 25px 55px #08142d66;display:grid;place-items:center;font-size:70px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 30px}.stat,.panel,.lesson-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 20px #162c5510}.stat{padding:17px 19px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:25px;display:block;margin-top:4px}.stat small{font-size:11px;color:#1b9b72}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:27px 0 14px}.section-head h2{font-size:20px;margin:2px 0}.section-head p{margin:0;color:var(--muted);font-size:12px}.link-btn{border:0;background:transparent;color:var(--blue);font-weight:750;font-size:12px}
.lesson-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.lesson-card{padding:17px;transition:.2s;cursor:pointer;min-height:175px}.lesson-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cbd8f6}.card-top{display:flex;justify-content:space-between;align-items:center}.lesson-icon{width:40px;height:40px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-size:19px}.tag{font-size:10px;color:var(--blue);background:#eef3ff;padding:5px 8px;border-radius:20px;font-weight:800}.lesson-card h3{font-size:14px;line-height:1.4;margin:14px 0 7px}.lesson-card p{font-size:11px;color:var(--muted);margin:0}.progress{height:5px;background:#edf0f5;border-radius:9px;margin-top:14px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2e66df,#70a5ff);width:0}
.two-col{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-top:18px}.panel{padding:20px}.panel h3{margin:0 0 13px;font-size:15px}.task{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0f2f6;font-size:12px}.task:last-child{border:0}.check{color:#18a477;font-weight:900}.muted{color:var(--muted)}
.page-title{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.page-title h1{font-size:27px;margin:3px 0}.page-title p{margin:0;color:var(--muted);font-size:13px}.lesson-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.slide-list{padding:12px;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:90px}.slide-list h3{font-size:13px;margin:8px 9px 12px}.slide-btn{width:100%;display:flex;gap:9px;align-items:center;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px;color:#66748d;font-size:11px}.slide-btn.active{background:#edf3ff;color:#2458d3;font-weight:800}.slide-btn span{width:22px;height:22px;border-radius:7px;background:#f0f2f6;display:grid;place-items:center;font-size:10px}.slide-btn.active span{background:#d9e6ff;color:#2458d3}.slide-view{min-height:450px}.slide-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:12px}.slide-content{background:linear-gradient(135deg,#fff,#f8faff);border:1px solid var(--line);border-radius:18px;padding:34px;min-height:350px}.slide-content h2{font-size:24px;line-height:1.3;margin:5px 0 22px;max-width:800px}.slide-content ul{padding-left:21px}.slide-content li{padding:7px 0;color:#40506c}.slide-content .slide-kicker{color:var(--blue);font-size:11px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}.slide-footer{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.secondary{border:1px solid var(--line);background:#fff;color:#33415e;padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700}.secondary:disabled{opacity:.4;cursor:not-allowed}
.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.resource{padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px}.resource .r-icon{font-size:23px}.resource h3{font-size:14px;margin:10px 0 5px}.resource p{font-size:11px;color:var(--muted);margin:0 0 12px}.resource a{font-size:11px;color:var(--blue);font-weight:800;text-decoration:none}
.notes-layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.note-form input,.note-form textarea,.note-form select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;margin:5px 0 11px;outline:none;background:#fff}.note-form textarea{min-height:110px;resize:vertical}.note-list{display:grid;gap:9px}.note-item{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}.note-item h4{margin:0 0 5px;font-size:13px}.note-item p{font-size:11px;color:#687792;margin:0 0 8px;white-space:pre-wrap}.note-item small{font-size:10px;color:#98a3b6}.note-actions{float:right;display:flex;gap:8px}.note-actions button{border:0;background:transparent;color:var(--blue);font-size:11px}.days{display:flex;gap:8px;margin:14px 0}.day{flex:1;text-align:center;padding:9px 3px;background:#f3f5f9;border-radius:9px;font-size:10px;color:#8a96aa}.day.done{background:#e7f8f1;color:#16845f;font-weight:800}
.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:20px;right:20px;background:#172849;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1100px){.lesson-grid{grid-template-columns:repeat(2,1fr)}.resource-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:13px}.brand{padding:0 6px 12px}.nav{display:flex;overflow:auto}.nav-label,.side-bottom{display:none}.nav button{width:auto;white-space:nowrap}.topbar{padding:0 16px}.search{width:145px}.content{padding:20px 15px 45px}.hero{grid-template-columns:1fr;padding:25px}.hero-visual{display:none}.stats{grid-template-columns:repeat(2,1fr)}.two-col,.lesson-layout,.notes-layout{grid-template-columns:1fr}.slide-list{position:static;max-height:190px}.resource-grid{grid-template-columns:1fr}.page-title{align-items:flex-start;flex-direction:column}}

<script>
const LESSONS = [{"code": "Bài 1", "title": "Tổng quan CMCN 4.0, CNTT 4.0 và Chuyển đổi số", "icon": "compass", "file": "Slide 1 - Tổng quan về CMCN 4.0, CNTT 4.0, CĐS.pptx", "slides": [{"number": 1, "content": ["TỔNG QUAN VỀ Cách mạng công nghiệp - CMCN 4.0 Công nghệ thông tin - CNTT 4.0 Chuyển đổi số - CĐS", "Conceive Design Implement Operate"]}, {"number": 2, "content": ["MỤC TIÊU", "TỔNG QUAN VỀ CMCN 4.0 & CNTT 4.0 & CĐS Sau bài học này sinh viên có thể: Hiểu khái niệm CMCN 4.0 và CNTT 4.0 Biết lịch sử các cuộc cách mạng công nghiệp Nhận diện các công nghệ cốt lõi của thời đại 4.0 Hiểu khái niệm chuyển đổi số (CĐS) Nhận biết cơ hội nghề nghiệp trong lĩnh vực CNTT Xác định các kỹ năng cần thiết cho sinh viên CNTT"]}, {"number": 3, "content": ["Khái niệm Cách mạng công nghiệp - CMCN", "Cách mạng công nghiệp là: Là sự thay đổi lớn trong công nghệ sản xuất, làm thay đổi cách con người làm việc. Gắn liền với những phát minh công nghệ mang tính đột phá như máy hơi nước, điện năng, máy tính. Tạo ra sự tăng trưởng mạnh về năng suất và kinh tế. Đồng thời thay đổi cấu trúc xã hội, ngành nghề và phương thức sản xuất. Ví dụ: - Máy hơi nước - Điện năng - Máy tính và Internet"]}, {"number": 4, "content": ["Các cuộc cách mạng công nghiệp - CMCN", "Nhân loại đã trải qua 4 cuộc cách mạng công nghiệp lớn: CMCN 1.0 – Cơ khí hóa sản xuất nhờ máy hơi nước. CMCN 2.0 – Sản xuất hàng loạt nhờ điện năng và dây chuyền sản xuất. CMCN 3.0 – Tự động hóa nhờ máy tính và công nghệ điện tử. CMCN 4.0 – Kết nối số, trí tuệ nhân tạo và dữ liệu lớn."]}, {"number": 5, "content": ["Cách mạng công nghiệp 1.0", "Thời gian: khoảng 1760 – 1840 Đặc điểm chính: Sử dụng máy hơi nước để thay thế sức người và sức động vật. Phát triển máy móc cơ khí trong ngành dệt và sản xuất. Hình thành các nhà máy sản xuất quy mô lớn. Ảnh hưởng: Tạo ra bước khởi đầu của nền công nghiệp hiện đại."]}, {"number": 6, "content": ["Cách mạng công nghiệp 2.0", "Thời gian: khoảng 1870 – đầu thế kỷ 20 Đặc điểm: Sử dụng điện năng thay cho máy hơi nước. Xuất hiện dây chuyền sản xuất hàng loạt. Phát triển mạnh ngành thép, hóa chất, điện lực. Ví dụ: Dây chuyền sản xuất ô tô của Henry Ford. Đèn điện, điện thoại…"]}, {"number": 7, "content": ["Cách mạng công nghiệp 3.0", "Thời gian: khoảng 1970 Đặc điểm: Sự xuất hiện của máy tính cá nhân. Công nghệ điện tử và bán dẫn phát triển mạnh. Internet bắt đầu xuất hiện và phát triển. Kết quả: Nhiều hệ thống sản xuất được tự động hóa bằng máy tính."]}, {"number": 8, "content": ["Cách mạng công nghiệp 4.0", "CMCN 4.0 bắt đầu khoảng 2010 đến nay Đặc điểm: Kết nối giữa thế giới vật lý và thế giới số. Máy móc có thể tự học và tự ra quyết định. Dữ liệu trở thành tài nguyên quan trọng. Công nghệ tiêu biểu:: AI IoT (Internet of Things) Robot thông minh"]}, {"number": 9, "content": ["Khái niệm Công nghệ thông tin - CNTT 4.0", "CNTT 4.0 là việc: Ứng dụng công nghệ thông tin hiện đại để xử lý dữ liệu và tự động hóa. Kết nối con người, thiết bị và hệ thống thông qua Internet. Tạo ra các hệ thống thông minh hỗ trợ ra quyết định. CNTT 4.0 là nền tảng của: Kinh tế số Xã hội số"]}, {"number": 10, "content": ["Đặc điểm của Công nghệ thông tin - CNTT 4.0", "Một số đặc điểm nổi bật: Kết nối toàn cầu thông qua Internet tốc độ cao. Xử lý dữ liệu lớn từ nhiều nguồn khác nhau. Tự động hóa và trí tuệ nhân tạo hỗ trợ công việc. Làm việc từ xa và cộng tác trực tuyến."]}, {"number": 11, "content": ["Các công nghệ chính của CMCN 4.0", "Các công nghệ nổi bật gồm: Trí tuệ nhân tạo (AI) – giúp máy tính học và suy luận. Internet of Things (IoT) – kết nối thiết bị với Internet. Big Data – xử lý lượng dữ liệu cực lớn. Cloud Computing – lưu trữ và xử lý dữ liệu trên Internet."]}, {"number": 12, "content": ["Trí tuệ nhân tạo (AI)", "AI là công nghệ giúp máy tính: Máy tính học từ dữ liệu và kinh nghiệm. Máy có thể nhận diện hình ảnh, giọng nói, văn bản. Máy hỗ trợ ra quyết định và dự đoán. Ví dụ: ChatGPT Nhận diện khuôn mặt Xe tự lái"]}, {"number": 13, "content": ["Internet of Things (IoT)", "IoT là mạng lưới: Các thiết bị vật lý được kết nối Internet. Các thiết bị có thể gửi và nhận dữ liệu với nhau. Ví dụ: Nhà thông minh Đồng hồ thông minh Camera giám sát"]}, {"number": 14, "content": ["Big Data", "Big Data là: Khối lượng dữ liệu cực lớn được tạo ra mỗi ngày. Đặc điểm: Volume – dữ liệu lớn Velocity – tốc độ cao Variety – nhiều loại dữ liệu Ứng dụng: Phân tích khách hàng Dự báo thị trường"]}, {"number": 15, "content": ["Cloud Computing", "Cloud Computing (Điện toán đám mây): Cho phép: Lưu trữ và xử lý dữ liệu trên hệ thống máy chủ Internet. Người dùng có thể truy cập dữ liệu mọi lúc mọi nơi. Ví dụ: Google Drive Microsoft Azure Amazon AWS"]}, {"number": 16, "content": ["Vai trò của CNTT 4.0", "CNTT 4.0 giúp: Tăng hiệu suất làm việc và năng suất lao động. Tự động hóa nhiều công việc lặp lại. Tạo ra các ngành nghề mới. Thúc đẩy kinh tế số và xã hội số."]}, {"number": 17, "content": ["Một số ngành nghề CNTT phổ biến", "Một số nghề phổ biến trong ngành CNTT: Lập trình viên (Software Developer) – xây dựng phần mềm. Kỹ sư AI – phát triển hệ thống trí tuệ nhân tạo. Phân tích dữ liệu (Data Analyst) Chuyên gia Quản trị hệ thống Chuyên gia an ninh mạng – bảo vệ hệ thống. Thiết kế UI/UX"]}, {"number": 18, "content": ["Cơ hội nghề nghiệp CNTT", "Ngành CNTT có: Nhu cầu nhân lực rất cao trên toàn thế giới. Thu nhập tương đối cao so với nhiều ngành khác. Cơ hội làm việc quốc tế Có thể làm việc từ xa Đây là một trong những ngành phát triển nhanh nhất thế giới"]}, {"number": 19, "content": ["Chuyển đổi số (CĐS) Digital transformation"]}, {"number": 20, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 21, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 22, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 23, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 24, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 25, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 26, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 27, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 28, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 29, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 30, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 31, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 32, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 33, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 34, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 35, "content": ["Chuyển đổi số (CĐS) ở Việt Nam"]}, {"number": 36, "content": ["Chuyển đổi số (CĐS) theo Liên hợp quốc - United Nations", "Chuyển đổi số & Các tiêu chuẩn toàn cầu"]}, {"number": 37, "content": ["Chuyển đổi số (CĐS) theo Liên hợp quốc - United Nations"]}, {"number": 38, "content": ["Chuyển đổi số (CĐS) theo Liên hợp quốc - United Nations"]}, {"number": 39, "content": ["Chuyển đổi số (CĐS) theo Liên hợp quốc - United Nations"]}, {"number": 40, "content": ["Chuyển đổi số (CĐS) theo Liên hợp quốc - United Nations"]}, {"number": 41, "content": ["Sinh viên trong thời đại CNTT 4.0", "Sinh viên cần: Chủ động học tập Làm quen với công nghệ mới Học tập suốt đời"]}, {"number": 42, "content": ["Các kỹ năng quan trọng", "Một số kỹ năng cần có: Kỹ năng sử dụng công nghệ Tư duy logic Tư duy lập trình Kỹ năng giải quyết vấn đề Kỹ năng làm việc nhóm", "Ngoài kỹ thuật, sinh viên cần: Kỹ năng giao tiếp Kỹ năng thuyết trình Quản lý thời gian Tư duy sáng tạo"]}, {"number": 43, "content": ["Lời khuyên cho sinh viên CNTT", "Để thành công trong ngành CNTT: Học chắc kiến thức cơ bản Thực hành nhiều Làm tốt bài tập và dự án thực tế Học tiếng Anh Cập nhật công nghệ mới"]}, {"number": 44, "content": ["TÓM TẮT BÀI HỌC", "Khái niệm CMCN 4.0, CNTT 4.0. Lịch sử các cuộc cách mạng công nghiệp. Các công nghệ nền tảng của thời đại 4.0. Khái niệm và vai trò chuyển đổi số CĐS. Các kỹ năng cần thiết cho sinh viên CNTT."]}, {"number": 45, "content": []}]}, {"code": "Bài 2", "title": "Kiến trúc và phần cứng máy tính", "icon": "cpu", "file": "Slide 2 - Computer, Hardware.pptx", "slides": [{"number": 1, "content": ["KIẾN TRÚC VÀ PHẦN CỨNG MÁY TÍNH", "Conceive Design Implement Operate", "Kiến trúc & Phần cứng máy tính"]}, {"number": 2, "content": ["MỤC LỤC", "Giới thiệu lịch sử phát triển của máy tính Phân loại máy tính phổ biến hiện nay Các thành phần phần cứng của máy tính Tìm hiểu CPU Tìm hiểu bộ nhớ Tìm hiểu thiết bị lưu trữ Tìm hiểu thiết bị ngoại vi Xu hướng phát triển công nghệ máy tính"]}, {"number": 3, "content": ["Mục tiêu bài học", "Sau bài học, sinh viên có thể: Hiểu sự phát triển cơ bản của máy tính Nhận biết các loại máy tính phổ biến Mô tả các thành phần phần cứng của máy tính Phân biệt CPU, RAM, ROM và thiết bị lưu trữ Biết lựa chọn thiết bị học tập phù hợp"]}, {"number": 4, "content": ["Khái niệm máy tính", "Máy tính là thiết bị điện tử dùng để xử lý thông tin. Máy tính nhận dữ liệu đầu vào, xử lý và đưa ra kết quả. Hoạt động của máy tính dựa trên các chương trình. Máy tính có khả năng xử lý nhanh, chính xác và lưu trữ lớn."]}, {"number": 5, "content": ["Lịch sử phát triển máy tính", "Thế hệ 1 (1945 – 1955) Công nghệ: Bóng đèn chân không (Vacuum Tube) Máy rất lớn, tiêu thụ điện nhiều", "Thế hệ 2 (1955 – 1965) Công nghệ: Transistor Máy nhỏ hơn và tin cậy hơn", "Thế hệ 3 (1965 – 1980) Công nghệ: Mạch tích hợp (IC), giúp tăng tốc độ xử lý máy tính nhỏ và nhanh hơn Xuất hiện hệ điều hành, bàn phím, màn hình", "Thế hệ 4 (1981 – nay) Công nghệ: Vi xử lý (Microprocessor) CPU ngày càng mạnh và nhỏ gọn Xuất hiện Laptop, tablet… máy tính hiện đại", "Thế hệ 5 (hiện tại – tương lai) Công nghệ: AI và xử lý song song Nhận dạng giọng nói Xử lý ngôn ngữ tự nhiên Hệ thống thông minh"]}, {"number": 6, "content": ["Phân loại máy tính theo quy mô và năng lực", "Siêu máy tính (supercomputer) Máy tính lớn (mainframe) Máy chủ (server): Máy tính cá nhân (PC)"]}, {"number": 7, "content": ["Phân loại máy tính theo hình thức sử dụng", "Máy tính để bàn (Dektop): hoạt động ổn định, dễ nâng cấp, hiệu năng cao, phù hợp học tập, làm việc cố định. Máy tính xách tay (Laptop): nhỏ gọn, nhẹ, dễ mang theo. Phù hợp học tập và làm việc di động Máy tính bảng (Tablet): gọn nhẹ, phù hợp ghi chú, đọc tài liệu. Hạn chế về hiệu năng và thao tác chuyên sâu so với laptop. Điện thoại thông minh (Smartphone): cũng là một dạng thiết bị tính toán hiện đại, hỗ trợ liên lạc, tra cứu và sử dụng nhiều ứng dụng số."]}, {"number": 8, "content": ["Mô hình hoạt động của máy tính", "Máy tính hoạt động theo mô hình xử lý thông tin cơ bản gồm: Input → Process → Output → Storage Input: nhận dữ liệu từ người dùng hoặc thiết bị. Process: xử lý dữ liệu bằng CPU. Output: xuất kết quả ra màn hình hoặc thiết bị khác. Storage: lưu trữ dữ liệu để sử dụng sau này."]}, {"number": 9, "content": ["Thiết bị nhập (Input devices)", "Thiết bị nhập là các thiết bị dùng để đưa dữ liệu hoặc lệnh vào máy tính. Một số thiết bị nhập phổ biến: Bàn phím (Keyboard). Chuột (Mouse). Máy quét (Scanner). Microphone. Webcam. Các thiết bị này giúp người dùng tương tác với hệ thống máy tính."]}, {"number": 10, "content": ["Bàn phím (Keyboard)", "Bàn phím là thiết bị nhập phổ biến nhất trong máy tính. Nó cho phép người dùng: Nhập văn bản. Nhập số liệu. Thực hiện các lệnh thông qua các phím chức năng. Bàn phím hiện nay có nhiều loại như bàn phím cơ, bàn phím màng và bàn phím không dây."]}, {"number": 11, "content": ["Chuột (Mouse)", "Chuột là thiết bị nhập giúp người dùng điều khiển con trỏ trên màn hình. Các chức năng chính của chuột: Di chuyển con trỏ. Nhấp chuột (click). Kéo thả (drag and drop). Cuộn trang (scroll). Chuột giúp thao tác trên giao diện đồ họa trở nên dễ dàng hơn."]}, {"number": 12, "content": ["Bộ xử lý trung tâm (CPU)", "CPU (Central Processing Unit) là bộ phận quan trọng nhất của máy tính. CPU thực hiện các chức năng: Xử lý các phép tính. Điều khiển hoạt động của toàn bộ hệ thống. Thực thi các chương trình phần mềm. CPU thường được gọi là “bộ não của máy tính”."]}, {"number": 13, "content": ["Các yếu tố ảnh hưởng hiệu năng CPU", "Một số yếu tố quan trọng quyết định hiệu năng của CPU: 1. Xung nhịp (Clock Speed) Đơn vị đo: GHz CPU phổ biến hiện nay: khoảng 2.5 – 5.0 GHz Xung nhịp càng cao thì khả năng xử lý lệnh càng nhanh. 2. Số nhân (Cores) CPU hiện nay thường có 4 – 16 nhân (cores) Một số CPU cao cấp có thể có hơn 24 nhân 3. Bộ nhớ Cache Là bộ nhớ tốc độ cao nằm trong CPU. Giúp CPU truy cập dữ liệu nhanh hơn RAM. Cache phổ biến: 8MB – 32MB."]}, {"number": 14, "content": ["Các hãng và dòng CPU phổ biến", "Hai hãng CPU phổ biến hiện nay là Intel và AMD Các dòng CPU phổ biến của Intel: Core i3 – mức cơ bản Core i5 – phổ biến cho học tập Core i7 – hiệu năng cao Core i9 – hiệu năng rất cao Các dòng phổ biến của AMD: Ryzen 3 Ryzen 5 Ryzen 7 Ryzen 9"]}, {"number": 15, "content": ["Tìm hiểu bộ nhớ (Memory)", "Bộ nhớ là nơi lưu trữ dữ liệu và chương trình trong quá trình máy tính hoạt động. Trong máy tính có hai loại bộ nhớ, chính: RAM và ROM. Mỗi loại bộ nhớ có tốc độ và chức năng khác nhau. Dung lượng bộ nhớ được đo bằng đơn vị: MB, GB, TB. Máy tính hiện nay thường có 8GB – 32GB RAM để đảm bảo chạy nhiều ứng dụng cùng lúc."]}, {"number": 16, "content": ["Bộ nhớ RAM", "RAM (Random Access Memory) là bộ nhớ tạm thời của máy. Đặc điểm Lưu trữ dữ liệu của chương trình đang chạy. Tốc độ truy cập rất nhanh. Dữ liệu sẽ mất khi tắt nguồn. Dung lượng RAM ảnh hưởng trực tiếp đến khả năng đa nhiệm và hiệu năng máy tính. Các loại RAM phổ biến DDR4 – phổ biến hiện nay DDR5 – thế hệ mới, tốc độ cao Dung lượng RAM phổ biến Laptop cơ bản: 8 GB Máy học tập / lập trình: 16 GB Máy đồ họa hoặc game: 32 GB trở lên", "RAM DDR5"]}, {"number": 17, "content": ["Bộ nhớ ROM", "ROM (Read Only Memory) là bộ nhớ chỉ đọc, dùng để lưu các chương trình quan trọng của hệ thống. Chức năng Lưu chương trình khởi động máy tính. Kiểm tra các thiết bị phần cứng khi bật máy. Khởi động hệ điều hành. Các loại ROM PROM – ROM lập trình một lần EEPROM / Flash ROM – ROM có thể ghi và xóa nhiều lần (phổ biến hiện nay) ROM thường chứa: BIOS / UEFI của máy tính Firmware trong các thiết bị điện tử"]}, {"number": 18, "content": ["Thiết bị lưu trữ", "Thiết bị lưu trữ dùng để lưu dữ liệu lâu dài trong máy tính. Một số thiết bị lưu trữ phổ biến: Ổ cứng HDD, Ổ cứng SSD USB Flash Drive Thẻ nhớ (Memory Card) Các thiết bị này dùng để lưu: Hệ điều hành, Phần mềm Tài liệu và dữ liệu người dùng Dữ liệu được lưu bằng các đơn vị: KB (Kilobyte) , MB (Megabyte) GB (Gigabyte) , TB (Terabyte)"]}, {"number": 19, "content": ["Thiết bị xuất (Output devices)", "Thiết bị xuất là các thiết bị dùng để hiển thị hoặc phát ra kết quả sau khi máy tính xử lý dữ liệu. Các thiết bị xuất phổ biến: Màn hình (Monitor). Máy in (Printer). Loa (Speaker). Máy chiếu (Projector). Nhờ các thiết bị này, người dùng có thể nhận được thông tin từ máy tính."]}, {"number": 20, "content": ["Màn hình (Monitor)", "Màn hình là thiết bị xuất quan trọng nhất của máy tính, dùng để hiển thị thông tin cho người dùng. Màn hình hiện: văn bản, hình ảnh, video, giao diện phần mềm Kích thước màn hình phổ biến hiện nay trong khoảng 14 – 27 inch, tùy thiết bị và mục đích sử dụng. Độ phân giải phổ biến Full HD (1920 × 1080) 2K / QHD (2560 × 1440) 4K (3840 × 2160) Các loại màn hình: LCD / LED – phổ biến nhất hiện nay OLED – chất lượng hiển thị cao, có trên laptop cao cấp Một số hãng màn hình nổi tiếng: Dell, LG, Samsung, ASUS, Acer"]}, {"number": 21, "content": ["Máy in (Printer)", "Máy in là thiết bị xuất dùng để in thông tin từ máy tính ra giấy. Các loại máy in phổ biến Máy in laser – phổ biến trong văn phòng, tốc độ nhanh Máy in phun (Inkjet) – thường dùng để in màu, in ảnh Phân loại theo màu in Máy in trắng đen – dùng cho văn bản Máy in màu – in hình ảnh, đồ họa Khổ giấy phổ biến A4 – phổ biến nhất A3 – dùng cho bản vẽ, thiết kế Một số hãng máy in nổi tiếng: HP, Canon, Epson, Brother"]}, {"number": 22, "content": ["Ví dụ một hệ thống máy tính hoàn chỉnh", "Một hệ thống máy tính hoàn chỉnh có thể bao gồm: CPU để xử lý dữ liệu. RAM để lưu trữ tạm thời chương trình. Ổ cứng để lưu trữ lâu dài. Thiết bị nhập như bàn phím và chuột. Thiết bị xuất như màn hình và máy in. Hệ điều hành để quản lý toàn bộ hệ thống. Tất cả các thành phần này hoạt động phối hợp với nhau."]}, {"number": 23, "content": ["Lựa chọn máy tính cho học tập", "Sinh viên cần chọn thiết bị dựa trên ngành học, môn học, điều kiện kinh tế và thói quen sử dụng hằng ngày. Với sinh viên CNTT, thiết bị học tập nên đáp ứng được nhu cầu soạn thảo, lập trình, học trực tuyến, làm bài tập nhóm và lưu trữ tài liệu. Thiết bị phù hợp không nhất thiết quá đắt. Cần đủ ổn định, bền, dễ sử dụng và đáp ứng nhu cầu học tập trong vài năm."]}, {"number": 24, "content": ["Tiêu chí chọn laptop hoặc PC học tập", "Bộ xử lý đủ mạnh để chạy các phần mềm học tập, trình duyệt nhiều tab và một số công cụ lập trình. Dung lượng RAM nên đủ để đa nhiệm tốt, tránh hiện tượng giật lag khi mở nhiều ứng dụng cùng lúc. Thiết bị lưu trữ nên ưu tiên ổ SSD vì tốc độ khởi động máy và mở ứng dụng nhanh hơn ổ cứng truyền thống. Màn hình rõ nét, bàn phím dễ gõ, pin đủ dùng, trọng lượng hợp lý là những cũng là yếu tố quan trọng. Ngoài cấu hình, cũng nên quan tâm đến độ bền, khả năng bảo hành và mức độ dễ sửa chữa của thiết bị."]}, {"number": 25, "content": ["Các lưu ý khi mua thiết bị học tập", "Không nên chỉ nhìn vào quảng cáo hoặc ngoại hình mà bỏ qua nhu cầu sử dụng thực tế. Cần cân nhắc giữa giá thành, hiệu năng, độ bền, pin, màn hình và khả năng nâng cấp sau này. Sinh viên nên ưu tiên thiết bị có hệ điều hành phổ biến, tương thích tốt với phần mềm học tập và cộng đồng hỗ trợ lớn. Ngoài máy tính, những phụ kiện như chuột, tai nghe, webcam, USB và balo chống sốc cũng góp phần nâng cao hiệu quả học tập."]}, {"number": 26, "content": ["Xu hướng phát triển công nghệ máy tính", "Công nghệ máy tính đang phát triển mạnh theo nhiều hướng mới nhằm tăng hiệu năng và giảm kích thước thiết bị. Một số xu hướng nổi bật: CPU ngày càng mạnh và nhiều nhân hơn : Các bộ vi xử lý hiện đại có nhiều nhân và xung nhịp cao, giúp xử lý dữ liệu nhanh và hỗ trợ đa nhiệm tốt. Công nghệ chip ngày càng nhỏ: Công nghệ chip 7nm  5nm  3nm giúp CPU mạnh hơn . tiêu thụ ít điện năng hơn. Thiết bị lưu trữ tốc độ cao: SSD NVMe đang dần thay thế HDD trong nhiều máy tính hiện đại, giúp tăng tốc độ khởi động và truy xuất dữ liệu. Bộ nhớ RAM ngày càng lớn: Các chuẩn mới như DDR5 giúp tăng tốc độ và dung lượng lớn hơn. Thiết bị ngày càng nhỏ gọn và tiết kiệm năng lượng: Laptop, tablet ngày càng mạnh nhưng mỏng và nhẹ hơn."]}, {"number": 27, "content": ["KIẾN TRÚC VÀ PHẦN CỨNG MÁY TÍNH", "Conceive Design Implement Operate", "Các thế hệ máy tính và Tương lai"]}, {"number": 28, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 29, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 30, "content": ["Các thế hệ máy tính và Tương lai", "Sự tiến bộ vĩ đại nhất của công nghệ nhân loại Chiếc điện thoại thông minh hiện nay có giá dưới 500 USD, sở hữu sức mạnh tương đương máy tính nhanh nhất thế giới vào năm 1993, lúc đó có giá khoảng 50 triệu USD"]}, {"number": 31, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 32, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 33, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 34, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 35, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 36, "content": ["Các thế hệ máy tính và Tương lai", "Máy tính lượng tử: Bước nhảy vọt của kỷ nguyên số Khám phá sự vượt trội của vật lý lượng tử so với giới hạn của máy tính cổ điển"]}, {"number": 37, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 38, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 39, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 40, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 41, "content": ["Các thế hệ máy tính và Tương lai"]}, {"number": 42, "content": ["Các thế hệ máy tính và Tương lai", "Máy tính lượng tử không chỉ là một cỗ máy nhanh hơn. Nó còn là một ngôn ngữ hoàn toàn mới để trò chuyện với vũ trụ"]}, {"number": 43, "content": ["Tổng kết", "Trong bài học này chúng ta đã tìm hiểu: Giới thiệu lịch sử phát triển của máy tính Phân loại máy tính phổ biến hiện nay Các thành phần phần cứng của máy tính Tìm hiểu CPU Tìm hiểu bộ nhớ Tìm hiểu thiết bị lưu trữ Tìm hiểu thiết bị ngoại vi Xu hướng phát triển công nghệ máy tính Những kiến thức này là nền tảng để tiếp tục học các nội dung sâu hơn các bài học và các môn sau"]}, {"number": 44, "content": []}]}, {"code": "Bài 3", "title": "Hệ điều hành và môi trường số đa nền tảng", "icon": "monitor", "file": "Slide 3 - Operating System.pptx", "slides": [{"number": 1, "content": ["TỔNG QUAN VỀ HỆ ĐIỀU HÀNH & MÔI TRƯỜNG SỐ ĐA NỀN TẢNG", "Conceive Design Implement Operate", "Hệ điều hành - Operating System"]}, {"number": 2, "content": ["MỤC LỤC", "Nội dung chính: Giới thiệu tổng quan về - Hệ điều hành máy tính – Operating System (OS), - Môi trường số đa nền tảng, - Công nghệ và bước tiến của hệ điều hành. Mục tiêu: Hiểu được các khái niệm cơ bản để sử dụng hiệu quả hệ điều hành máy tính. Giới thiệu hệ điều hành phổ biến Hướng dẫn cài đặt hệ điều hành Những vấn đề lưu ý để sử dụng hệ điều hành hiệu quả"]}, {"number": 3, "content": ["Hệ điều hành – Operating System (OS)"]}, {"number": 4, "content": ["Hệ điều hành"]}, {"number": 5, "content": ["Hệ điều hành"]}, {"number": 6, "content": ["Hệ điều hành"]}, {"number": 7, "content": ["Hệ điều hành"]}, {"number": 8, "content": ["Hệ điều hành"]}, {"number": 9, "content": ["Hệ điều hành"]}, {"number": 10, "content": ["Hệ điều hành"]}, {"number": 11, "content": ["Hệ điều hành"]}, {"number": 12, "content": ["Hệ điều hành"]}, {"number": 13, "content": ["Hệ điều hành"]}, {"number": 14, "content": ["Sử dụng hệ điều hành hiệu quả"]}, {"number": 15, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 16, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 17, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 18, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 19, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 20, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 21, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 22, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 23, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 24, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 25, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 26, "content": ["Sử dụng Hệ điều hành hiệu quả"]}, {"number": 27, "content": ["TỔNG QUAN VỀ HỆ ĐIỀU HÀNH & MÔI TRƯỜNG SỐ ĐA NỀN TẢNG", "Conceive Design Implement Operate", "Môi trường số Đa nền tảng"]}, {"number": 28, "content": ["Khái niệm hệ sinh thái hợp nhất Unifined Ecosystem"]}, {"number": 29, "content": ["Hệ sinh thái hợp nhất – Unifined Ecosystem"]}, {"number": 30, "content": ["Hệ sinh thái hợp nhất – Unifined Ecosystem"]}, {"number": 31, "content": ["Hệ sinh thái hợp nhất – Unifined Ecosystem"]}, {"number": 32, "content": ["Hệ sinh thái hợp nhất – Unifined Ecosystem"]}, {"number": 33, "content": ["ảo hóa - Virtualization, và Containerzation (Docker)"]}, {"number": 34, "content": ["Ảo hóa - Virtualization, và Containerzation - Docker"]}, {"number": 35, "content": ["Ảo hóa - Virtualization, và Containerzation - Docker"]}, {"number": 36, "content": ["Ảo hóa - Virtualization, và Containerzation - Docker", "Lựa chọn kiến trúc phụ thuộc vào độ ưu tiên của hệ thống: Bảo mật tối đa (VM) hay Hiệu suất và tốc độ linh hoạt (Container)"]}, {"number": 37, "content": ["Hệ điều hành tích hợp AI AI-Integrated OS"]}, {"number": 38, "content": ["Hệ điều hành tích hợp AI (AI-Integrated OS)"]}, {"number": 39, "content": ["Hệ điều hành tích hợp AI (AI-Integrated OS)"]}, {"number": 40, "content": ["Hệ điều hành tích hợp AI (AI-Integrated OS)"]}, {"number": 41, "content": ["Hệ điều hành tích hợp AI (AI-Integrated OS)", "Sự chuyển dịch mô hình Hệ điều hành"]}, {"number": 42, "content": ["Hệ điều hành tích hợp AI (AI-Integrated OS)"]}, {"number": 43, "content": ["Summary", "Giới thiệu các khái niệm cơ bản - Hệ điều hành máy tính – Operating System (OS), - Môi trường số đa nền tảng, - Công nghệ và bước tiến của hệ điều hành. Giới thiệu hệ điều hành phổ biến Hướng dẫn cài đặt hệ điều hành Những vấn đề lưu ý để sử dụng hệ điều hành hiệu quả"]}, {"number": 44, "content": []}]}, {"code": "Bài 4", "title": "Phần mềm, điện toán đám mây và nền tảng", "icon": "cloud", "file": "Slide 4 - Software, Cloud, Platform.pptx", "slides": [{"number": 1, "content": ["TỔNG QUAN VỀ PHẦN MỀM, ĐÁM MÂY, NỀN TẢNG", "Conceive Design Implement Operate", "Software, Cloud Computing, Platform"]}, {"number": 2, "content": ["MỤC LỤC", "Nội dung chính: Giới thiệu tổng quan về - Phần mềm – Software, - Điện toán đám mây – Cloud computing, - Nền tảng – Platform. Mục tiêu: Hiểu được các khái niệm cơ bản để thích nghi với sự chuyển dịch công nghệ. Giới thiệu vài phần mềm chuyên dụng Hướng dẫn download, cài đặt, gỡ cài đặt phần mềm Hướng dẫn sử dụng vài dịch vụ cloud phổ biến"]}, {"number": 3, "content": ["PHẦN MỀM – SOFTWARE"]}, {"number": 4, "content": ["Phần mềm máy tính", "Theo tiêu chuẩn IEEE (1991) (gần như tương đồng với định nghĩa của ISO), phần mềm máy tính được định nghĩa là: Các chương trình máy tính, quy trình và có thể bao gồm các tài liệu và dữ liệu liên quan đến việc vận hành một hệ thống máy tính.", "IEEE (Institute of Electrical and Electronics Engineers) là một tổ chức chuyên môn quốc tế uy tín, đóng vai trò dẫn đầu trong việc phát triển các tiêu chuẩn về kỹ thuật phần mềm và đảm bảo chất lượng phần mềm (SQA)", "Chương trình máy tính (Mã nguồn/Code) Quy trình (Procedures): Xác định trình tự và lịch trình thực hiện chương trình Tài liệu (Documentation): - Tài liệu phát triển - Tài liệu người dùng - Tài liệu bảo trì Dữ liệu (Data)"]}, {"number": 5, "content": ["Phần mềm máy tính", "Phân loại phần mềm thành 2 nhóm chính", "Phần mềm hệ thống: Hệ điều hành, làm nền móng quản lý tài nguyên phần cứng. Phần mềm ứng dụng: Công cụ thực hiện các công việc trực tiếp cho con người.", "Không có các phần mềm, chúng ta sẽ không tận dụng được các ưu điểm của phần cứng máy tính."]}, {"number": 6, "content": ["Phần mềm máy tính – Hệ điều hành", "Hệ điều hành", "Vai trò chính là \"người điều phối\" hoạt động của phần mềm và các phần mềm chạy trên máy tính (phần cứng) Phân bổ tài nguyên: CPU, bộ nhớ và các thiết bị ngoại vi cho các ứng dụng"]}, {"number": 7, "content": ["Phần mềm máy tính – Phần mềm ứng dụng", "Phần mềm ứng dụng", "Công cụ thực hiện tác vụ cụ thể theo nhu cầu người dùng. Luôn hoạt động dựa trên sự hỗ trợ của hệ điều hành. Rất đa dạng và thay đổi theo nhu cầu"]}, {"number": 8, "content": ["Phần mềm máy tính", "Phần mềm cài đặt chung với hệ điều hành: Khi cài đặt hệ điều hành, người ta thường tích hợp sẵn một số phần mềm khá hữu ích cho người dùng Tính toán: Calculator Ghi chép không định dạng: Notepad Phần mềm xử lý hình ảnh cơ bản: Paint Phần mềm chụp màn hình, cắt hình: Snipping tool Phần mềm phóng to màn hình: Magnifier Phần mềm nghe nhạc: Windows Media Player Phần mềm ghi âm: Steps Recorder Trình duyệt web: Internet Explorer"]}, {"number": 9, "content": ["Demo các phần mềm có sẵn trong máy tính"]}, {"number": 10, "content": ["Phần mềm cơ bản", "Các phần mềm cơ bản cần thiết cho hầu hết các máy tính Phần mềm xử lý văn bản, tính toán: Microsoft Office, Open Office, WPS Office … Phần mềm nén & giải nén: Winrar, Winzip, 7 – Zip, … Bộ gõ tiếng Việt: Unikey, Vietkey, EVKey, … Trình duyệt web: Chrome, Edge, Firefox, Cốc Cốc, … Phần mềm đọc file PDF: Foxit Reader, Adobe Reader, …"]}, {"number": 11, "content": ["Office", "Word: Là một chương trình soạn thảo văn bản. Cho phép người dùng làm việc với các hiệu ứng như phông chữ, màu sắc, cùng với hình ảnh đồ họa (graphics) và nhiều hiệu ứng đa phương tiện (multimedia) khác Excel: Phần mềm này giúp tạo ra các bảng tính, cùng các tính năng, công cụ hỗ trợ người dùng tính toán dữ liệu nhanh, chính xác với số lượng hàng triệu ô tính. PowerPoint: Là ứng dụng giúp các bạn có thể tạo các slide trình chiếu, thuyết trình… (Như các bạn đang thấy)"]}, {"number": 12, "content": ["Phần mềm nén và giải nén", "Nén file là gì? Vì sao phải nén file?"]}, {"number": 13, "content": ["Phần mềm nén và giải nén", "Nén file là gì? Vì sao phải nén file. Để giảm dung lượng file gốc, tiết kiệm dung lượng lưu trữ cho ổ cứng. Sắp xếp cho dữ liệu gọn gàng và ngăn nắp hơn. Thuận tiện trong việc sao chép, đính kèm khi gửi email. Chia sẻ file trên internet nhanh chóng và dễ dàng. Bảo vệ file, những thông tin nhạy cảm bằng cách nén có mật khẩu."]}, {"number": 14, "content": ["Bộ gõ tiếng Việt", "Bộ gõ tiếng Việt là một loại phần mềm hỗ trợ soạn thảo văn bản bằng tiếng Việt trên máy tính Các bộ gõ tiếng Việt khác nhau sẽ hỗ trợ một hay nhiều bảng mã và kiểu gõ. Mỗi bảng mã quy định việc thể hiện font chữ khác nhau Unicode: là bộ mã chuẩn quốc tế được thiết kế để dùng làm bộ mã duy nhất cho tất cả các ngôn ngữ khác nhau trên thế giới. Các font phổ biến như Arial, Times New Roman, Tahoma, … TCVN3: Bảng mã theo tiêu chuẩn (cũ) của Việt Nam VNI: Bảng mã do công ty VNI (Vietnam-International) sở hữu bản quyền. Các font chữ trong bảng mã VNI có tên bắt đầu bằng VNI-, ví dụ như VNI-Times."]}, {"number": 15, "content": ["Trình duyệt web", "Trình duyệt web còn được gọi là web browser hoặc trình duyệt Internet, trình duyệt là một chương trình phần mềm để trình bày và khám phá nội dung trên World Wide Web Trình duyệt web đưa bạn đến mọi nơi trên internet, cho phép bạn xem văn bản, hình ảnh và video từ mọi nơi trên thế giới. Thống kê sử dụng trình duyệt web Google Chrome (… %) Mozilla Firefox (… %) Safari (… %) (Hệ điều hành MacOS) Microsoft Edge (… %) Internet Explorer (… %)"]}, {"number": 16, "content": ["Phần mềm đọc file PDF", "PDF (Portable Document Format) là định dạng tài liệu di động, tập tin văn bản khá phổ biến của hãng Adobe Systems Ưu điểm: Nội dung trình bày đa dạng cùng với khả năng bảo mật cực kỳ tốt. Bạn có thể in ra trên bất cứ thiết bị nào mà vẫn giữ nguyên được định dạng. Hỗ trợ trên hầu hết các loại thiết bị di động. Tài liệu dạng PDF thường có kích thước khá nhỏ khiến cho việc di chuyển, chia sẻ rất dễ dàng. Để đọc được file PDF, chúng ta cần cài đặt phần mềm đọc file PDF"]}, {"number": 17, "content": ["Demo các phần mềm cơ bản"]}, {"number": 18, "content": ["Phần mềm chuyên dụng", "Là phần mềm giúp người dùng thực hiện các nhiệm vụ đòi hỏi tính chuyên môn.", "Y tế: theo dõi nhịp tim, hỗ trợ chẩn đoán bệnh, … Giáo dục: quản lý thi cử, hỗ trợ học tập nghiên cứu, … Ngân hàng: giao dịch thanh toán, liên kết các ngân hàng, … Doanh nghiệp: Quản lý doanh thu, khách hàng, …", "Các hệ thống phần mềm có thể hoạt động riêng rẽ hoặc liên kết với nhau", "Phần mềm nhúng Firmware Được tích hợp trực tiếp vào phần cứng Ô tô: giám sát nhiên liệu, hoạt động cơ cấu thắng xe, … Lò vi sóng: Điều khiển thời gian, nhiệt độ, …"]}, {"number": 19, "content": ["Phần mềm nguồn mở", "Là phần mềm cho phép tự do tiếp cận và sửa đổi mã nguồn", "Người dùng có quyền nghiên cứu, thay đổi và phân phối lại mã nguồn. Việc công khai mã nguồn giúp tăng sự tin tưởng của cộng đồng. Sự sáng tạo: Kết hợp nhiều góc nhìn đa dạng ngoài một công ty duy nhất."]}, {"number": 20, "content": ["BẢN QUYỀN PHẦN MỀM"]}, {"number": 21, "content": ["Bản quyền phần mềm", "Bản quyền phần mềm là quyền được phép sử dụng phần mềm đó một cách hợp pháp Khi chúng ta muốn xài một phần mềm nào đó, chúng ta phải trả tiền cho đơn vị phát hành phần mềm Cũng có một số hệ thống phần mềm mà chúng ta sử dụng không cần trả tiền, đó là phần mềm miễn phí hoặc Open Source"]}, {"number": 22, "content": ["Bản quyền phần mềm", "Ưu điểm khi sử dụng phần mềm có bản quyền Được cập nhật thường xuyên và đầy đủ Hưởng phục vụ của nhà sản xuất Sử dụng được tất cả các tính năng Không sợ bị lây nhiễm virus"]}, {"number": 23, "content": ["Bản quyền phần mềm", "Phân loại các phần mềm sau: Phần mềm nào có bản quyền, phần mềm nào miễn phí, phần mềm nào có nhiều phiên bản… Microsoft Office, winrar, foxit reader, Adobe Illustrator, Unikey, Internet Download Manager, Cốc Cốc, Zalo, Camtasia, Google Drive, Ultra ISO, AutoCAD, Droid4X, Netbean"]}, {"number": 24, "content": ["Cloud Computing, Platform", "TỔNG QUAN VỀ PHẦN MỀM, ĐÁM MÂY, NỀN TẢNG", "Conceive Design Implement Operate"]}, {"number": 25, "content": ["ĐÁM MÂY – CLOUD COMPUTING"]}, {"number": 26, "content": ["Điện toán đám mây – Cloud Computing", "Điện toán đám mây được ISO định nghĩa là \"một mô hình cho phép truy cập mạng (internet) vào một nhóm tài nguyên vật lý hoặc ảo có thể chia sẻ, có thể mở rộng và linh hoạt với khả năng cung cấp và quản lý tự phục vụ theo yêu cầu“, Nó thường được gọi là \"đám mây“ – cloud.", "Người dùng / Thiết bị đầu cuối Máy tính, Máy tính bảng, Điện thoại, … Nhà cung cấp dịch vụ cloud Amazon AWS, Google Cloud, Microsoft Azure, FPT Cloud, VNPT Cloud, Viettel Cloud, … Nhà cung cấp dịch vụ Viễn thông, Kỹ thuật, Điện, Siêu thị, Ngân hàng, Giao Thông, Giáo dục, Giải trí, …", "Cloud Computing"]}, {"number": 27, "content": ["Điện toán đám mây – Ứng dụng"]}, {"number": 28, "content": ["Điện toán đám mây – Cloud Computing", "Điện toán đám mây được theo chuẩn NIST – NIST Models “không phải cứ kết nối mạng là cloud, một cloud thực thụ phải hội đủ 5 yếu tố”", "Broad Network Access Truy cập mạng rộng rãi On-demand self-service Tự phục vụ theo nhu cầu Rapid elasticity Co giãn nhanh Measured Service Đo lường dịch vụ Resource pooling Dùng chung tài nguyên", "NIST – National Institude of Standards and Technology"]}, {"number": 29, "content": ["Điện toán đám mây – Phân loại", "Cloud Service Models", "Software as a Service", "Platform as a Service", "Infrastructure as a Service"]}, {"number": 30, "content": ["Điện toán đám mây – Phân loại", "IaaS – Infrastructure as a Service Hạ tầng như một dịch vụ Thuê máy chủ ảo, bộ nhớ, mạng Tự cài đặt hệ điều hành, và bảo mật Ví dụ : Amazon EC2", "SaaS – Software as a Service Phần mềm như một dịch vụ Phần mềm hoàn chỉnh chạy trên web Không cần cài đặt, không cần quản lý, chỉ đăng nhập và sử dụng Ví dụ: Microsoft 365, Google Workspace"]}, {"number": 31, "content": ["Điện toán đám mây – Phân loại", "PaaS – Platform as a Service Nền tảng như một dịch vụ Trái tim của lập trình viên Nằm giữa IaaS và SaaS, PaaS giải quyết vấn đề quản lý máy chủ Môi trường tích hợp: cung cấp sẵn ngôn ngữ, thư viện, database Tập trung vào code: chỉ cần “mang source code đến và chạy” Tăng tốc độ: biến ý tưởng thành ứng dụng thực tế với tốc độ nhanh"]}, {"number": 32, "content": ["Điện toán đám mây – Phân loại"]}, {"number": 33, "content": ["Điện toán đám mây – Public Cloud", "Public Cloud – Đám mây công cộng Định nghĩa: Là hệ thống được vận hành và cung cấp bởi các nhà cung cấp dịch vụ đám mây bên thứ ba thông qua internet Đặc điểm chính: Tài nguyên được chia sẻ (Shared resources) theo dạng đa người thuê (Multi tenant) Lợi ích nổi bật: Tiết kiệm chi phí đầu tư ban đầu Triển khai ứng dụng nhanh chóng Không cần bảo trì hạ tầng vật lý Phù hợp nhất cho các doanh nghiệp cần sự linh hoạt tối đa mà không muốn quản lý trung tâm dữ liệu"]}, {"number": 34, "content": ["Điện toán đám mây – Private Cloud", "Private Cloud – Đám mây riêng Định nghĩa: Là môi trường đám mây được xây dựng, quản lý và sở hữu bởi một tổ chức duy nhất, thuờng được lưu trữ nội bộ (on-premise) Đặc điểm chính: Tài nguyên được sử dụng độc quyền (Exclusive use), không chia sẻ với bên ngoài Lợi ích nổi bật: Bảo mật và quyền riêng tư cao nhất Kiểm soát toàn diện đối với dữ liệu và hạ tầng Tùy chỉnh theo nhu cầu đặc thù Lựa chọn hàng đầu cho các tổ chức có yêu cầu nghiêm ngặt về tuân thủ quy định và bảo vệ dữ liệu"]}, {"number": 35, "content": ["Điện toán đám mây – Hybrid Cloud", "Hybrid Cloud – Đám mây lai Định nghĩa: Là sự kết hợp giữa Public Cloud và Private Cloud, cho phép chia sẻ dữ liệu và ứng dụng giữa 2 môi trường Đặc điểm chính: Tính di động cao của dữ liệu và khối lượng công việc (Data / App portability) Lợi ích nổi bật: Tận dụng khả năng mở rộng của Public Cloud Duy trì sự tuân thủ và bảo mật của Private Cloud Tối ưu hóa tính linh hoạt cho doanh nghiệp"]}, {"number": 36, "content": ["Điện toán đám mây – Hybrid Cloud", "Mang lại “những gì tốt nhất của Public Cloud và Private Cloud”, giúp tối ưu hóa hiệu suất và chi phí"]}, {"number": 37, "content": ["Điện toán đám mây – Multi Cloud", "Multi Cloud – Đa đám mây Định nghĩa: Là việc triển khai các ứng dụng trên các đám mây khác nhau Đặc điểm chính: nhiều đám mây khác nhau cùng được kết nối vào hệ thống Các vấn đề nổi bật: Tính linh hoạt Tránh lệ thuộc vào 1 nhà cung cấp Khả năng xử lý mạnh mẽ Hệ thống lớn và phức tạp"]}, {"number": 38, "content": ["Điện toán đám mây – Community Cloud", "Community Cloud – Đám mây cộng đồng", "Định nghĩa: Là mô hình chia sẻ tài nguyên cho các nhóm có chung mối quan tâm, được thiết kế cho các tổ chức có cùng ngành (ví dụ: y tế, giáo dục, ngân hàng, …) có chung các yêu cầu về bảo mật và tuân thủ pháp lý", "Đặc điểm chính: tài nguyên được chia sẻ trong cộng đồng nhằm giảm chi phí xây dựng các private cloud riêng lẻ"]}, {"number": 39, "content": ["Điện toán đám mây – Dịch vụ"]}, {"number": 40, "content": ["Điện toán đám mây – Cloud Computing", "Ví dụ: cá nhân / nhóm tự tạo các nội dung sau Nơi lưu trữ : Drive (Google Drive, Microsoft OneDrive, …) File văn bản : Word (Google Docs, Microsoft Word, …) File bảng tính : Excel (Google Sheets, Microsoft Excel, …)"]}, {"number": 41, "content": ["NỀN TẢNG – PLATFORM"]}, {"number": 42, "content": ["Điện toán đám mây – Platform", "Cloud Service Models", "Software as a Service", "Platform as a Service", "Infrastructure as a Service", "PLATFORMS"]}, {"number": 43, "content": ["PaaS – Platform as a Service Là môi trường phát triển và triển khai toàn diện, nằm trên lớp IaaS Người dùng (developer) kiểm soát hoàn toàn ứng dụng và cấu hình, trong khi đó nhà cung cấp dịch vụ đám mây – cloud quản lý hạ tầng (mạng, máy chủ vật lý, thiết bị lưu trữ, …)", "IaaS – HẠ TẦNG", "Điện toán đám mây – Platform", "PaaS – PLATFORMS", "SaaS - ỨNG DỤNG"]}, {"number": 44, "content": ["PaaS – Platform as a Service Gồm các thành phần cốt lõi: Hệ điều hành – OS Phần mềm trung gian – Midleware Công cụ phát triển – DevTools Cơ sở dữ liệu – Database", "IaaS – HẠ TẦNG", "Điện toán đám mây – Platform", "PaaS – PLATFORMS", "SaaS - ỨNG DỤNG"]}, {"number": 45, "content": ["PaaS – Platform as a Service Mô hình triển khai Public PaaS Rút ngắn thời gian ra mắt thị trường, Fast time-to-market Nhà cung cấp bên thứ 3 quản lý midleware và công cụ Tối ưu chi phí qua mô hình thanh toán theo mức sử dụng, pay-per-ues, với khả năng mở rộng (elasticity) tức thì", "Điện toán đám mây – Platform", "Mô hình triển khai Private PaaS Bảo mật và kiểm soát tối đa, triển khai hoàn toàn sau tường lửa của tổ chức (corporate firewall) Quản trị tuân thủ (governance) nghiêm ngặt, tích hợp sâu với các hệ thống lõi truyền thống Đóng vai trò như “nhà cung cấp nội bộ”, chuẩn hóa công cụ cho lập trình viên trong tổ chức", "PaaS – Biến ý tưởng thành ứng dụng, nhường gánh nặng cho hạ tầng đám mây"]}, {"number": 46, "content": []}, {"number": 47, "content": ["Summary", "Giới thiệu các khái niệm cơ bản software, cloud computing, platform Giới thiệu các phần mềm cơ bản, và chuyên dụng Hướng dẫn download và cài đặt / gỡ phần mềm Giới thiệu một số dịch vụ cloud Hướng dẫn sử dụng vài dịch vụ cloud phổ biến Giới thiệu một số platform"]}, {"number": 48, "content": []}]}, {"code": "Bài 5", "title": "Mạng máy tính, Internet và IoT", "icon": "network", "file": "Slide 5 - Network, Internet, IOT.pptx", "slides": [{"number": 1, "content": ["TỔNG QUAN VỀ MẠNG TRONG KỶ NGUYÊN SỐ VÀ INTERNET 4.0", "Conceive Design Implement Operate"]}, {"number": 2, "content": ["MỤC LỤC", "Nội dung chính: Giới thiệu tổng quan về - Mạng máy tính (computer network), Mạng internet - Tầm nhìn tương lai và sự phát triển của mạng. - Internet kết nối vạn vật – IOT Mục tiêu : - Hiểu được các k document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function card(l,i){let done=JSON.parse(localStorage.getItem("cntt_done")||"[]").includes(i);return `<article class="lesson-card" onclick="openLesson(${i})"><div class="card-top"><div class="lesson-icon">${icons[l.icon]}</div><span class="tag">${l.code}</span></div><h3>${l.title}</h3><p>${l.slides.length} slide · ${done?"Đã học":"Chưa hoàn thành"}</p><div class="progress"><i style="width:${done?100:0}%"></i></div></article>`}
function home(){document.getElementById("view").innerHTML=`<section class="hero"><div><div class="eyebrow">FPT Polytechnic · Digital learning</div><h1>Chào mừng đến với<br>thế giới CNTT 4.0</h1><p>Không gian học tập số của bạn — khám phá công nghệ, xây dựng kiến thức và phát triển kỹ năng cho kỷ nguyên số.</p><button class="primary" onclick="openLesson(0)">Bắt đầu học tập&nbsp; →</button></div><div class="hero-visual"><div class="orb">⌘</div></div></section>
<div class="stats"><div class="stat"><span>Chương trình học</span><strong>08</strong><small>8 chủ đề bài học</small></div><div class="stat"><span>Tổng số slide</span><strong>${LESSONS.reduce((a,l)=>a+l.slides.length,0)}</strong><small>Nội dung từ PowerPoint</small></div><div class="stat"><span>Ghi chú cá nhân</span><strong>${notes.length}</strong><small>Được lưu trên thiết bị</small></div><div class="stat"><span>Ngày học đã ghi nhận</span><strong>${visits.length}/5</strong><small>Tiến độ sử dụng</small></div></div>
<div class="section-head"><div><div class="eyebrow">Learning path</div><h2>Chương trình học của bạn</h2><p>Chọn một bài học để bắt đầu khám phá.</p></div><button class="link-btn" onclick="setPage('lessons')">Xem tất cả →</button></div><div class="lesson-grid">${LESSONS.map(card).join("")}</div>
<div class="two-col"><section class="panel"><h3>✦ Việc cần hoàn thành</h3><div class="task"><span class="check">✓</span><span>Thu thập tài liệu cho đủ 8 bài học</span></div><div class="task"><span class="check">✓</span><span>Xây dựng thư viện số cá nhân gồm file, hình ảnh/video, liên kết và ghi chú</span></div><div class="task"><span>○</span><span>Hoàn thiện ứng dụng quản lý ghi chú với tối thiểu 10 ghi chú</span></div><div class="task"><span>○</span><span>Sử dụng và ghi nhận tiến độ trong ít nhất 5 ngày</span></div></section><section class="panel"><h3>📌 Ghi chú gần đây</h3>${notes.slice(-3).reverse().map(n=>`<div class="task"><span>✎</span><span><b>${esc(n.title)}</b><br><span class="muted">${esc(n.lesson)} · ${esc(n.date)}</span></span></div>`).join("")}</section></div>`}
function lessonIndex(){document.getElementById("view").innerHTML=`<div class="page-title"><div><div class="eyebrow">Course curriculum</div><h1>8 bài học CNTT 4.0</h1><p>Toàn bộ slide đã được tách thành từng bài và từng trang nội dung.</p></div><span class="tag">8 MODULES</span></div><div class="lesson-grid">${LESSONS.map(card).join("")}</div>`}
function openLesson(i){currentLesson=i;currentSlide=0;renderLesson();document.getElementById("crumb").textContent=LESSONS[i].code;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page==="lessons"));window.scrollTo(0,0)}
function renderLesson(){let l=LESSONS[currentLesson],s=l.slides[currentSlide],title=s.content[0]||l.title,body=s.content.slice(1).filter(t=>t.length>1);let done=JSON.parse(localStorage.getItem("cntt_done")||"[]");document.getElementById("view").innerHTML=`<div class="page-title"><div><div class="eyebrow">${l.code} · ${l.slides.length} slides</div><h1>${esc(l.title)}</h1><p>Nội dung được trích xuất từ bộ slide bài giảng gốc.</p></div><button class="secondary" onclick="setPage('lessons')">← Danh sách bài học</button></div><div class="lesson-layout"><aside class="panel slide-list"><h3>Nội dung bài học</h3>${l.slides.map((x,i)=>`<button class="slide-btn ${i===currentSlide?"active":""}" onclick="goSlide(${i})"><span>${i+1}</span>${esc((x.content[0]||"Slide "+(i+1)).slice(0,36))}</button>`).join("")}</aside><section class="slide-view"><div class="slide-meta"><span>${l.code} / SLIDE ${currentSlide+1}</span><span>${Math.round((currentSlide+1)/l.slides.length*100)}% nội dung</span></div><article class="slide-content"><div class="slide-kicker">${l.code} · FPT Polytechnic</div><h2>${esc(title)}</h2>${body.length?`<ul>${body.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:`<p class="muted">Trang trình bày mở đầu hoặc trang minh họa trong slide gốc. Hãy xem tài liệu PowerPoint gốc để quan sát đầy đủ hình ảnh và sơ đồ.</p>`}</article><div class="slide-footer"><button class="secondary" ${currentSlide===0?"disabled":""} onclick="goSlide(${currentSlide-1})">← Trang trước</button><span class="muted" style="font-size:11px">Slide ${currentSlide+1} / ${l.slides.length}</span><button class="primary" onclick="${currentSlide===l.slides.length-1?"completeLesson()":"goSlide("+(currentSlide+1)+")"}">${currentSlide===l.slides.length-1?"Hoàn thành bài ✓":"Tiếp theo →"}</button></div><div style="display:flex;justify-content:space-between;margin-top:18px"><button class="link-btn" onclick="openLesson(${Math.max(0,currentLesson-1)})">← Bài trước</button><button class="link-btn" onclick="openLesson(${Math.min(7,currentLesson+1)})">Bài tiếp theo →</button></div></section></div>`}
function goSlide(i){currentSlide=Math.max(0,Math.min(LESSONS[currentLesson].slides.length-1,i));renderLesson()}
function completeLesson(){let a=JSON.parse(localStorage.getItem("cntt_done")||"[]");if(!a.includes(currentLesson))a.push(currentLesson);localStorage.setItem("cntt_done",JSON.stringify(a));toast("Đã đánh dấu hoàn thành "+LESSONS[currentLesson].code);renderLesson()}
function library(){document.getElementById("view").innerHTML=`<div class="page-title"><div><div class="eyebrow">Personal digital library</div><h1>Thư viện số</h1><p>Tập hợp tài liệu học tập, nguồn tham khảo và ghi chú theo yêu cầu Assignment.</p></div></div><div class="resource-grid">${LESSONS.map((l,i)=>`<article class="resource"><div class="r-icon">${icons[l.icon]}</div><h3>${l.code} · ${esc(l.title)}</h3><p>${l.slides.length} slide nội dung. Có thể mở bài học để xem nội dung đã tách trang.</p><a href="javascript:openLesson(${i})">MỞ BÀI HỌC →</a></article>`).join("")}</div><div class="two-col"><section class="panel"><h3>📚 Thành phần thư viện theo Assignment</h3><div class="task">▣ <span><b>Tài liệu:</b> 8 bộ PowerPoint gốc được đính kèm trong gói website.</span></div><div class="task">▧ <span><b>Hình ảnh / Video:</b> Bổ sung tư liệu minh họa theo từng chủ đề khi học.</span></div><div class="task">↗ <span><b>Liên kết tham khảo:</b> <a href="https://caodang.fpt.edu.vn" target="_blank">FPT Polytechnic</a> · <a href="https://www.ieee.org" target="_blank">IEEE</a> · <a href="https://www.iso.org" target="_blank">ISO</a></span></div><div class="task">✎ <span><b>Ghi chú cá nhân:</b> Tạo và quản lý tại mục Ghi chú cá nhân.</span></div></section><section class="panel"><h3>Gợi ý sử dụng</h3><p class="muted" style="font-size:12px">Mỗi bài học là một thư mục kiến thức. Sau khi học, hãy ghi lại ý chính, câu hỏi còn thắc mắc và ví dụ ứng dụng của riêng bạn.</p><button class="secondary" onclick="setPage('notes')">Mở ghi chú →</button></section></div>`}
function notesPage(){document.getElementById("view").innerHTML=`<div class="page-title"><div><div class="eyebrow">Personal workspace</div><h1>Ghi chú cá nhân</h1><p>Tạo, chỉnh sửa và lưu những kiến thức quan trọng trong quá trình học.</p></div><span class="tag">${notes.length} GHI CHÚ</span></div><div class="notes-layout"><section class="panel note-form"><h3 id="formTitle">＋ Tạo ghi chú mới</h3><label class="muted" style="font-size:11px">Tiêu đề</label><input id="noteTitle" placeholder="Ví dụ: Phân biệt RAM và ROM"><label class="muted" style="font-size:11px">Bài học</label><select id="noteLesson">${LESSONS.map((l,i)=>`<option>${l.code}</option>`).join("")}</select><label class="muted" style="font-size:11px">Nội dung</label><textarea id="noteBody" placeholder="Viết nội dung bạn muốn ghi nhớ..."></textarea><button class="primary" style="width:100%" onclick="saveNote()">Lưu ghi chú</button><button class="secondary" style="width:100%;margin-top:8px" onclick="resetNote()">Làm mới</button></section><section><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Danh sách ghi chú</b><input id="noteSearch" class="search" style="width:180px" placeholder="Tìm ghi chú..." oninput="renderNotes()"></div><div id="noteList" class="note-list"></div></section></div>`;renderNotes()}
function renderNotes(){let q=(document.getElementById("noteSearch")?.value||"").toLowerCase();let arr=notes.filter(n=>(n.title+n.body+n.lesson).toLowerCase().includes(q));document.getElementById("noteList").innerHTML=arr.length?arr.slice().reverse().map(n=>`<article class="note-item"><div class="note-actions"><button onclick="editNote(${n.id})">Sửa</button><button onclick="deleteNote(${n.id})">Xóa</button></div><h4>${esc(n.title)}</h4><p>${esc(n.body)}</p><small>${esc(n.lesson)} · ${esc(n.date)}</small></article>`).join(""):`<div class="panel empty">Chưa tìm thấy ghi chú phù hợp.</div>`}
function saveNote(){let title=document.getElementById("noteTitle").value.trim(),body=document.getElementById("noteBody").value.trim(),lesson=document.getElementById("noteLesson").value;if(!title||!body){toast("Vui lòng nhập tiêu đề và nội dung.");return}if(editId){let n=notes.find(x=>x.id===editId);Object.assign(n,{title,body,lesson,date:new Date().toLocaleDateString("vi-VN")})}else notes.push({id:Date.now(),title,body,lesson,date:new Date().toLocaleDateString("vi-VN")});save();editId=null;notesPage();toast("Đã lưu ghi chú.")}
function editNote(id){let n=notes.find(x=>x.id===id);editId=id;document.getElementById("noteTitle").value=n.title;document.getElementById("noteBody").value=n.body;document.getElementById("noteLesson").value=n.lesson;document.getElementById("formTitle").textContent="✎ Chỉnh sửa ghi chú";window.scrollTo(0,0)}
function deleteNote(id){if(confirm("Bạn có chắc muốn xóa ghi chú này?")){notes=notes.filter(n=>n.id!==id);save();renderNotes();toast("Đã xóa ghi chú.")}}
function resetNote(){editId=null;document.getElementById("noteTitle").value="";document.getElementById("noteBody").value="";document.getElementById("formTitle").textContent="＋ Tạo ghi chú mới"}
function journey(){let days=Array.from({length:5},(_,i)=>{let d=new Date();d.setDate(d.getDate()-4+i);let key=d.toISOString().slice(0,10);return {key,label:["T2","T3","T4","T5","T6","T7","CN"][d.getDay()],done:visits.includes(key)}});document.getElementById("view").innerHTML=`<div class="page-title"><div><div class="eyebrow">Learning consistency</div><h1>Hành trình 5 ngày</h1><p>Theo dõi những ngày website được sử dụng trên thiết bị này.</p></div><span class="tag">${visits.length} NGÀY ĐÃ GHI NHẬN</span></div><section class="panel"><h3>Hoạt động 5 ngày gần nhất</h3><div class="days">${days.map(d=>`<div class="day ${d.done?"done":""}">${d.label}<br><b>${d.done?"✓":"·"}</b><br>${d.key.slice(5)}</div>`).join("")}</div><p class="muted" style="font-size:12px">Website tự ghi nhận ngày có truy cập. Yêu cầu sử dụng ít nhất 5 ngày chỉ được xác nhận khi bạn thực sự sử dụng trong 5 ngày khác nhau. Dữ liệu được lưu trong trình duyệt hiện tại.</p></section><div class="two-col"><section class="panel"><h3>Gợi ý kế hoạch học</h3>${["Ngày 1 · Bài 1 và Bài 2: tổng quan, phần cứng","Ngày 2 · Bài 3 và Bài 4: hệ điều hành, phần mềm","Ngày 3 · Bài 5: mạng, Internet và IoT","Ngày 4 · Bài 6 và Bài 7: tư duy, AI và dữ liệu","Ngày 5 · Bài 8: an toàn thông tin; tổng ôn"].map(x=>`<div class="task">◷ <span>${x}</span></div>`).join("")}</section><section class="panel"><h3>Tiến độ Assignment</h3><div class="task">✓ <span>8 bài học đã được tổ chức thành module</span></div><div class="task">✓ <span>Đã có ${notes.length} ghi chú mẫu (có thể sửa/xóa)</span></div><div class="task">○ <span>Tiếp tục sử dụng đủ 5 ngày thực tế</span></div><div class="task">○ <span>Bổ sung hình ảnh, video và ghi chú cá nhân</span></div></section></div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("globalSearch").addEventListener("input",e=>{let q=e.target.value.toLowerCase();if(!q)return;setPage("lessons");document.getElementById("view").querySelectorAll(".lesson-card").forEach((c,i)=>c.style.display=(LESSONS[i].title+LESSONS[i].code).toLowerCase().includes(q)?"":"none")});
home();
</script></body></html>
